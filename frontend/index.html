<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Entry - Challenge Platform</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #db2777 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #334155;
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
    }

    .container { max-width: 650px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; }

    .hero-tag {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    /* Shared Navigation Bar */
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--surface-border);
      transition: all 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; }

    form { display: flex; flex-direction: column; gap: 1.2rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #fff;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    button {
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    #submissionStatus {
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 0.5rem;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="hero-tag">Anti-Farming Engine</span>
      <h1>Challenge Hub</h1>
      <p>Submit proof and earn verified rankings</p>
      <nav class="nav-bar">
        <a href="index.html" class="nav-link active">Submit Entry</a>
        <a href="leaderboard.html" class="nav-link">Standings</a>
        <a href="arena.html" class="nav-link">Peer Arena</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>🚀 Submit Entry</h2>
        <form id="submission-form">
          <div class="form-group">
            <label for="userId">Participant ID</label>
            <input type="text" id="userId" placeholder="Enter user UUID or handle" required />
          </div>

          <div class="form-group">
            <label for="challengeSelect">Challenge Track</label>
            <select id="challengeSelect">
              <option value="5k-run" data-type="metric">5K Speed Run (Metric)</option>
              <option value="photo-contest" data-type="subjective">AI Prompt Arena (Pairwise Elo)</option>
              <option value="book-reading" data-type="boolean">Deploy Contract (Boolean Completion)</option>
            </select>
          </div>

          <div id="dynamicMetricField" class="form-group">
            <label for="metricInput">Raw Performance Metric (Minutes / Reps)</label>
            <input type="number" id="metricInput" step="any" placeholder="e.g. 21.4" />
          </div>

          <div class="form-group">
            <label for="evidenceUrl">Proof or Media URL</label>
            <input type="url" id="evidenceUrl" placeholder="https://github.com/..." required />
          </div>

          <div class="form-group">
            <label for="verificationTier">Verification Tier</label>
            <select id="verificationTier">
              <option value="0">Tier 0: Self-reported (0.3x)</option>
              <option value="1">Tier 1: Evidence Attached (0.5x)</option>
              <option value="2">Tier 2: Peer-verified (1.0x)</option>
              <option value="3">Tier 3: Sensor / API Verified (1.1x)</option>
              <option value="4">Tier 4: Moderator Verified (1.2x)</option>
            </select>
          </div>

          <button type="submit">Submit Entry</button>
        </form>
        <p id="submissionStatus"></p>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:8080/api";

    const challengeSelect = document.getElementById("challengeSelect");
    const dynamicMetricField = document.getElementById("dynamicMetricField");

    challengeSelect.addEventListener("change", (e) => {
      const selectedType = e.target.selectedOptions[0].dataset.type;
      dynamicMetricField.style.display = (selectedType === "metric") ? "flex" : "none";
    });

    document.getElementById("submission-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        userId: document.getElementById("userId").value,
        challengeId: challengeSelect.value,
        rawMetric: parseFloat(document.getElementById("metricInput").value) || null,
        contentUrl: document.getElementById("evidenceUrl").value,
        verificationTier: parseInt(document.getElementById("verificationTier").value, 10)
      };

      try {
        const res = await fetch(`${API_BASE}/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          document.getElementById("submissionStatus").textContent = "Entry saved! Go to Standings to see your rank.";
        }
      } catch (err) {
        document.getElementById("submissionStatus").textContent = "Mock submit successful (Offline Demo Mode)";
      }
    });
  </script>
</body>
</html>
