<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Challenge Platform</title>
  <style>
    /* --- CSS Reset & Variables --- */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
      --radius-lg: 12px;
      --radius-md: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      letter-spacing: -0.015em;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
    }

    input, select {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    #submissionStatus {
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 0.75rem;
      color: #16a34a;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .tier-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body { padding: 1.25rem 0.75rem; }
      .card { padding: 1.25rem; }
      header h1 { font-size: 1.5rem; }
      th, td { padding: 0.65rem 0.5rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Community Challenge Platform</h1>
      <p>Fair, anti-farming competition hub</p>
    </header>

    <!-- Section 1: Submit Entry Form -->
    <section class="card">
      <h2>Submit Challenge Entry</h2>
      <form id="submission-form">
        <div class="form-group">
          <label for="userId">User ID</label>
          <input type="text" id="userId" placeholder="Enter your user UUID" required />
        </div>

        <div class="form-group">
          <label for="challengeSelect">Select Challenge</label>
          <select id="challengeSelect">
            <option value="5k-run" data-type="metric">5K Run (Metric)</option>
            <option value="photo-contest" data-type="subjective">Nature Photography (Subjective / Elo)</option>
            <option value="book-reading" data-type="boolean">Read 1 Book (Completion)</option>
          </select>
        </div>

        <!-- Dynamic field: changes per evaluation type -->
        <div id="dynamicMetricField" class="form-group">
          <label for="metricInput">Performance Metric (e.g. Minutes / Reps)</label>
          <input type="number" id="metricInput" step="any" placeholder="e.g. 23.5" />
        </div>

        <div class="form-group">
          <label for="evidenceUrl">Proof / Media URL</label>
          <input type="url" id="evidenceUrl" placeholder="https://example.com/proof.jpg" required />
        </div>

        <div class="form-group">
          <label for="verificationTier">Verification Tier</label>
          <select id="verificationTier">
            <option value="0">Tier 0: Self-reported (Multiplier 0.3x)</option>
            <option value="1">Tier 1: Evidence Attached (Multiplier 0.5x)</option>
            <option value="2">Tier 2: Peer-verified (Multiplier 1.0x)</option>
            <option value="3">Tier 3: Sensor / API Verified (Multiplier 1.1x)</option>
            <option value="4">Tier 4: Moderator Verified (Multiplier 1.2x)</option>
          </select>
        </div>

        <button type="submit">Submit Entry</button>
      </form>
      <p id="submissionStatus"></p>
    </section>

    <!-- Section 2: Leaderboard with Tier Filter -->
    <section class="card">
      <h2>Leaderboard</h2>
      <div class="form-group">
        <label for="filterTier">Filter by Minimum Verification Tier:</label>
        <select id="filterTier" onchange="loadLeaderboard()">
          <option value="0">All Submissions (Tier 0+)</option>
          <option value="2">Verified Only (Tier 2+)</option>
          <option value="4">Moderator Verified Only (Tier 4)</option>
        </select>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>User</th>
              <th>Score / Percentile</th>
              <th>Trust Tier</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <!-- Rendered dynamically -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const API_BASE = "http://localhost:8080/api";

    const challengeSelect = document.getElementById("challengeSelect");
    const dynamicMetricField = document.getElementById("dynamicMetricField");

    challengeSelect.addEventListener("change", (e) => {
      const selectedType = e.target.selectedOptions[0].dataset.type;
      dynamicMetricField.style.display = (selectedType === "metric") ? "flex" : "none";
    });

    document.getElementById("submission-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        userId: document.getElementById("userId").value,
        challengeId: challengeSelect.value,
        rawMetric: parseFloat(document.getElementById("metricInput").value) || null,
        contentUrl: document.getElementById("evidenceUrl").value,
        verificationTier: parseInt(document.getElementById("verificationTier").value, 10)
      };

      try {
        const res = await fetch(`${API_BASE}/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          document.getElementById("submissionStatus").textContent = "Submission recorded (overwrites previous active entry)!";
          loadLeaderboard();
        }
      } catch (err) {
        document.getElementById("submissionStatus").textContent = "Backend offline. Test submission logged to console.";
        console.log("Mock Submission Payload:", payload);
      }
    });

    async function loadLeaderboard() {
      const minTier = document.getElementById("filterTier").value;
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";

      try {
        const res = await fetch(`${API_BASE}/challenges/${challengeSelect.value}/leaderboard?min_tier=${minTier}`);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        // Fallback demo data
        renderTable([
          { user: "User_Alpha", score: "96.4th Percentile", tier: "Tier 2 (Peer)" },
          { user: "User_Bravo", score: "88.1th Percentile", tier: "Tier 1 (Evidence)" },
          { user: "User_Charlie", score: "54.0th Percentile", tier: "Tier 0 (Self)" }
        ]);
      }
    }

    function renderTable(rows) {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = rows.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.user}</td>
          <td>${r.score}</td>
          <td><span class="tier-badge">${r.tier}</span></td>
        </tr>
      `).join('');
    }

    loadLeaderboard();
  </script>
</body>
</html>
