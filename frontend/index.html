<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Challenge Platform</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #db2777 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #334155;
      --tier-gold: linear-gradient(135deg, #f59e0b, #d97706);
      --tier-blue: linear-gradient(135deg, #06b6d4, #0284c7);
      --tier-green: linear-gradient(135deg, #10b981, #059669);
      --radius: 16px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* --- Hero Header --- */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .hero-tag {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* --- Side-by-Side Responsive Grid --- */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* --- Glassmorphism Cards --- */
    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* --- Modern Form Inputs --- */
    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #fff;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    select option {
      background-color: #0f172a;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    #submissionStatus {
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 0.5rem;
      color: #4ade80;
    }

    /* --- Leaderboard Table --- */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      background: rgba(15, 23, 42, 0.8);
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--surface-border);
      color: #e2e8f0;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Rank Highlighting */
    .rank-cell {
      font-weight: 800;
      color: #a855f7;
    }

    /* Vibrant Tier Badges */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-moderator { background: var(--tier-gold); }
    .badge-peer { background: var(--tier-blue); }
    .badge-self { background: #475569; }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <span class="hero-tag">Anti-Farming Engine</span>
      <h1>Community Challenge Platform</h1>
      <p>Decentralized, reputation-weighted competition and verification hub</p>
    </header>

    <main class="dashboard-grid">
      <!-- Section 1: Submit Entry Form -->
      <section class="card">
        <h2>🚀 Submit Entry</h2>
        <form id="submission-form">
          <div class="form-group">
            <label for="userId">Participant ID</label>
            <input type="text" id="userId" placeholder="Enter user UUID or handle" required />
          </div>

          <div class="form-group">
            <label for="challengeSelect">Challenge Track</label>
            <select id="challengeSelect">
              <option value="5k-run" data-type="metric">5K Speed Run (Metric)</option>
              <option value="photo-contest" data-type="subjective">AI Prompt Arena (Pairwise Elo)</option>
              <option value="book-reading" data-type="boolean">Deploy Contract (Boolean Completion)</option>
            </select>
          </div>

          <div id="dynamicMetricField" class="form-group">
            <label for="metricInput">Raw Performance Metric (Minutes / Reps)</label>
            <input type="number" id="metricInput" step="any" placeholder="e.g. 21.4" />
          </div>

          <div class="form-group">
            <label for="evidenceUrl">Proof or Media URL</label>
            <input type="url" id="evidenceUrl" placeholder="https://github.com/..." required />
          </div>

          <div class="form-group">
            <label for="verificationTier">Verification Tier</label>
            <select id="verificationTier">
              <option value="0">Tier 0: Self-reported (0.3x)</option>
              <option value="1">Tier 1: Evidence Attached (0.5x)</option>
              <option value="2">Tier 2: Peer-verified (1.0x)</option>
              <option value="3">Tier 3: Sensor / API Verified (1.1x)</option>
              <option value="4">Tier 4: Moderator Verified (1.2x)</option>
            </select>
          </div>

          <button type="submit">Submit Entry</button>
        </form>
        <p id="submissionStatus"></p>
      </section>

      <!-- Section 2: Leaderboard with Tier Filter -->
      <section class="card">
        <h2>🏆 Real-time Standings</h2>
        <div class="form-group">
          <label for="filterTier">Filter By Trust Level:</label>
          <select id="filterTier" onchange="loadLeaderboard()">
            <option value="0">Show All Entries (Tier 0+)</option>
            <option value="2">Peer Verified & Up (Tier 2+)</option>
            <option value="4">Moderator Certified (Tier 4)</option>
          </select>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Participant</th>
                <th>Percentile Rank</th>
                <th>Verification</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

  </div>

  <script>
    const API_BASE = "http://localhost:8080/api";

    const challengeSelect = document.getElementById("challengeSelect");
    const dynamicMetricField = document.getElementById("dynamicMetricField");

    challengeSelect.addEventListener("change", (e) => {
      const selectedType = e.target.selectedOptions[0].dataset.type;
      dynamicMetricField.style.display = (selectedType === "metric") ? "flex" : "none";
    });

    document.getElementById("submission-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        userId: document.getElementById("userId").value,
        challengeId: challengeSelect.value,
        rawMetric: parseFloat(document.getElementById("metricInput").value) || null,
        contentUrl: document.getElementById("evidenceUrl").value,
        verificationTier: parseInt(document.getElementById("verificationTier").value, 10)
      };

      try {
        const res = await fetch(`${API_BASE}/submissions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          document.getElementById("submissionStatus").textContent = "Entry saved! Leaderboard recalculated.";
          loadLeaderboard();
        }
      } catch (err) {
        document.getElementById("submissionStatus").textContent = "Mock submit successful (Offline Demo Mode)";
      }
    });

    async function loadLeaderboard() {
      const minTier = parseInt(document.getElementById("filterTier").value, 10);
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Loading scores...</td></tr>";

      try {
        const res = await fetch(`${API_BASE}/challenges/${challengeSelect.value}/leaderboard?min_tier=${minTier}`);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        // Fallback demo mock data demonstrating score percentiles & anti-gaming tiers
        const sampleData = [
          { user: "dev_satoshi", score: "99.2%", tier: 4, label: "Moderator" },
          { user: "quantum_coder", score: "88.5%", tier: 2, label: "Peer Verified" },
          { user: "pixel_hunter", score: "64.1%", tier: 2, label: "Peer Verified" },
          { user: "newbie_farmer", score: "42.0%", tier: 0, label: "Self Reported" }
        ];
        renderTable(sampleData.filter(item => item.tier >= minTier));
      }
    }

    function renderTable(rows) {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = rows.map((r, i) => {
        let badgeClass = "badge-self";
        if (r.tier >= 4) badgeClass = "badge-moderator";
        else if (r.tier >= 2) badgeClass = "badge-peer";

        return `
          <tr>
            <td class="rank-cell">0${i + 1}</td>
            <td style="font-weight:600;">${r.user}</td>
            <td><strong style="color:#38bdf8;">${r.score}</strong></td>
            <td><span class="badge ${badgeClass}">${r.label}</span></td>
          </tr>
        `;
      }).join('');
    }

    loadLeaderboard();
  </script>
</body>
</html>
