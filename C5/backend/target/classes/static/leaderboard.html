<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings - Challenge Platform</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #334155;
      --tier-gold: linear-gradient(135deg, #f59e0b, #d97706);
      --tier-blue: linear-gradient(135deg, #06b6d4, #0284c7);
      --radius: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      padding: 2.5rem 1.5rem;
    }

    .container { max-width: 850px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; }

    .hero-tag {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p { color: var(--text-muted); font-size: 1.05rem; }

    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--surface-border);
      transition: all 0.2s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.2rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.2rem; }
    label { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }

    select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #fff;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    select option { background: #0f172a; color: #fff; }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      background: rgba(15, 23, 42, 0.85);
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--surface-border);
      color: #e2e8f0;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.03); }

    .rank-cell { font-weight: 800; color: #a855f7; }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-moderator { background: var(--tier-gold); }
    .badge-peer { background: var(--tier-blue); }
    .badge-self { background: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="hero-tag">Anti-Farming Engine</span>
      <h1>Real-Time Standings</h1>
      <p>Reputation-weighted rankings filtered by verification tier</p>
      <nav class="nav-bar">
        <a href="index.html" class="nav-link">Submit Entry</a>
        <a href="leaderboard.html" class="nav-link active">Standings</a>
        <a href="arena.html" class="nav-link">Peer Arena</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>🏆 Leaderboard</h2>
        <div class="form-group">
          <label for="filterTier">Filter By Trust Level:</label>
          <select id="filterTier" onchange="loadLeaderboard()">
            <option value="0">Show All Entries (Tier 0+)</option>
            <option value="2">Peer Verified & Up (Tier 2+)</option>
            <option value="4">Moderator Certified (Tier 4)</option>
          </select>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Participant</th>
                <th>Score</th>
                <th>Verification</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_BASE = "http://localhost:8080/api";

    async function loadLeaderboard() {
      const minTier = parseInt(document.getElementById("filterTier").value, 10);
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Loading scores...</td></tr>";

      try {
        const res = await fetch(`${API_BASE}/challenges/5k-run/leaderboard?min_tier=${minTier}`);
        const data = await res.json();
        renderTable(data);
      } catch (err) {
        const sampleData = [
          { user: "dev_satoshi", score: "99.2%", tier: 4, label: "Moderator" },
          { user: "quantum_coder", score: "88.5%", tier: 2, label: "Peer Verified" },
          { user: "pixel_hunter", score: "64.1%", tier: 2, label: "Peer Verified" },
          { user: "newbie_farmer", score: "42.0%", tier: 0, label: "Self Reported" }
        ];
        renderTable(sampleData.filter(item => item.tier >= minTier));
      }
    }

    function renderTable(rows) {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = rows.map((r, i) => {
        let badgeClass = "badge-self";
        if (r.tier >= 4) badgeClass = "badge-moderator";
        else if (r.tier >= 2) badgeClass = "badge-peer";

        return `
          <tr>
            <td class="rank-cell">0${i + 1}</td>
            <td style="font-weight:600;">${r.user}</td>
            <td><strong style="color:#38bdf8;">${r.score}</strong></td>
            <td><span class="badge ${badgeClass}">${r.label}</span></td>
          </tr>
        `;
      }).join('');
    }

    loadLeaderboard();
  </script>
</body>
</html>
