<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Standings - Challenge Hub</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Track Switcher Tabs */
    .track-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(10, 15, 29, 0.7);
      padding: 0.35rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--surface-border);
      width: fit-content;
      margin-bottom: 1.5rem;
    }

    .track-tab {
      padding: 0.45rem 1.15rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .track-tab:hover {
      color: #fff;
    }

    .track-tab.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.3);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.5);
    }

    /* Podium Cards for Top 3 */
    .podium-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: end;
    }

    @media (max-width: 640px) {
      .podium-grid {
        grid-template-columns: 1fr;
      }
    }

    .podium-card {
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: 1.4rem 1rem;
      text-align: center;
      border: 1px solid var(--surface-border);
      position: relative;
      transition: transform 0.25s ease;
    }

    .podium-card:hover {
      transform: translateY(-4px);
    }

    .podium-1st {
      border-color: rgba(245, 158, 11, 0.5);
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, rgba(15, 23, 42, 0.7) 100%);
      box-shadow: 0 10px 30px -5px rgba(245, 158, 11, 0.25);
      order: 2;
      padding-top: 1.8rem;
    }

    .podium-2nd {
      border-color: rgba(148, 163, 184, 0.4);
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.12) 0%, rgba(15, 23, 42, 0.7) 100%);
      order: 1;
    }

    .podium-3rd {
      border-color: rgba(217, 119, 6, 0.35);
      background: linear-gradient(180deg, rgba(180, 83, 9, 0.12) 0%, rgba(15, 23, 42, 0.7) 100%);
      order: 3;
    }

    .podium-crown {
      font-size: 2rem;
      margin-bottom: 0.35rem;
    }

    .podium-user {
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .podium-score {
      font-size: 1.4rem;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .filter-box {
      min-width: 200px;
    }

    /* Table Styling */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
      background: rgba(10, 15, 29, 0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      background: rgba(15, 23, 42, 0.95);
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      padding: 1rem;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--surface-border);
      color: #e2e8f0;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.025); }

    .rank-num {
      font-weight: 800;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: #a855f7;
    }

    .participant-cell {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      color: #fff;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Score Progress Bar */
    .score-cell {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 140px;
    }

    .score-val {
      font-weight: 800;
      font-family: var(--font-mono);
      color: #38bdf8;
      font-size: 0.95rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--grad-primary);
      border-radius: var(--radius-pill);
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container animate-fade">
    <header>
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span>Anti-Farming Engine v2.0</span>
      </div>
      <h1>Real-Time Standings</h1>
      <p>Reputation-weighted rankings dynamically filtered by verification trust tier.</p>
      
      <nav class="nav-bar">
        <a href="index.html" class="nav-link">
          <span>🚀</span> Submit Entry
        </a>
        <a href="leaderboard.html" class="nav-link active">
          <span>🏆</span> Standings
        </a>
        <a href="arena.html" class="nav-link">
          <span>⚖️</span> Peer Arena
        </a>
      </nav>
    </header>

    <main>
      <section class="card">
        <!-- Challenge Track Tabs -->
        <div class="track-tabs">
          <button class="track-tab active" data-track="5k-run">
            <span>🏃</span> 5K Speed Run (Percentile)
          </button>
          <button class="track-tab" data-track="photo-contest">
            <span>🎨</span> AI Prompt Arena (Elo)
          </button>
        </div>

        <!-- Top 3 Podium -->
        <div class="podium-grid" id="podiumContainer">
          <!-- Dynamically populated -->
        </div>

        <!-- Search & Filter Controls -->
        <div class="controls-bar">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search participant handle..." oninput="filterTable()" />
          </div>
          <div class="filter-box">
            <select id="filterTier" onchange="loadStandings()">
              <option value="0">Show All Entries (Tier 0+)</option>
              <option value="2">Peer Verified & Up (Tier 2+)</option>
              <option value="4">Moderator Certified (Tier 4 ⭐)</option>
            </select>
          </div>
          <button class="btn-secondary" onclick="resetDefaults()">
            <span>🔄</span> Reset Demo Data
          </button>
        </div>

        <!-- Standings Table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th style="width: 70px;">Rank</th>
                <th>Participant</th>
                <th>Calibrated Score</th>
                <th>Trust Tier</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="api.js"></script>
  <script>
    let currentTrack = "5k-run";
    let allRows = [];

    document.querySelectorAll(".track-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".track-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentTrack = tab.dataset.track;
        loadStandings();
      });
    });

    async function loadStandings() {
      const minTier = parseInt(document.getElementById("filterTier").value, 10);
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 2rem;'>Loading calibrated standings...</td></tr>";

      try {
        allRows = await window.API.getLeaderboard(currentTrack, minTier);
        renderPodium(allRows);
        renderTable(allRows);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan='4' style='text-align:center; color:#f87171; padding: 2rem;'>Error loading standings: ${err.message}</td></tr>`;
      }
    }

    function renderPodium(rows) {
      const container = document.getElementById("podiumContainer");
      if (!rows || rows.length < 3) {
        container.style.display = "none";
        return;
      }
      container.style.display = "grid";

      const first = rows[0];
      const second = rows[1];
      const third = rows[2];

      container.innerHTML = `
        <!-- 2nd Place -->
        <div class="podium-card podium-2nd">
          <div class="podium-crown">🥈</div>
          <div class="podium-user">${second.user}</div>
          <div class="podium-score">${second.score}</div>
          <span class="badge ${second.badgeClass}">${second.label}</span>
        </div>

        <!-- 1st Place -->
        <div class="podium-card podium-1st">
          <div class="podium-crown">🥇</div>
          <div class="podium-user">${first.user}</div>
          <div class="podium-score">${first.score}</div>
          <span class="badge ${first.badgeClass}">${first.label}</span>
        </div>

        <!-- 3rd Place -->
        <div class="podium-card podium-3rd">
          <div class="podium-crown">🥉</div>
          <div class="podium-user">${third.user}</div>
          <div class="podium-score">${third.score}</div>
          <span class="badge ${third.badgeClass}">${third.label}</span>
        </div>
      `;
    }

    function renderTable(rows) {
      const tbody = document.getElementById("leaderboardBody");
      if (!rows || rows.length === 0) {
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:#94a3b8; padding: 2rem;'>No entries found matching this filter.</td></tr>";
        return;
      }

      tbody.innerHTML = rows.map((r, i) => {
        const medal = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : `#${(i + 1).toString().padStart(2, '0')}`));
        const numScore = parseFloat(r.score) || 0;
        const widthPercent = currentTrack === "5k-run" ? Math.min(100, Math.max(5, numScore)) : Math.min(100, Math.max(10, ((numScore - 800) / 600) * 100));
        const initials = r.user.substring(0, 2).toUpperCase();

        return `
          <tr>
            <td><span class="rank-num">${medal}</span></td>
            <td>
              <div class="participant-cell">
                <div class="user-avatar">${initials}</div>
                <span>${r.user}</span>
              </div>
            </td>
            <td>
              <div class="score-cell">
                <span class="score-val">${r.score}</span>
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${widthPercent}%;"></div>
                </div>
              </div>
            </td>
            <td><span class="badge ${r.badgeClass}">${r.label}</span></td>
          </tr>
        `;
      }).join('');
    }

    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allRows.filter(r => r.user.toLowerCase().includes(query));
      renderTable(filtered);
    }

    function resetDefaults() {
      if (confirm("Reset leaderboard entries to default verified sample state?")) {
        window.API.reset();
        loadStandings();
      }
    }

    loadStandings();
  </script>
</body>
</html>
